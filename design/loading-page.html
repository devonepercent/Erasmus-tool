<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#06070f;font-family:Poppins,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{display:flex;align-items:center;justify-content:center}
.stage{position:relative;width:min(100vw,430px);height:min(100vh,860px);overflow:hidden;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;
  background:radial-gradient(ellipse at 50% 38%,rgba(150,95,30,.45),transparent 62%),linear-gradient(180deg,#0b1450 0%,#0d0f1a 55%,#06070f 100%)}
@media (min-width:600px){.stage{border-radius:32px;box-shadow:0 30px 80px rgba(0,0,0,.5)}}
.lvid{position:absolute;inset:0;opacity:0;transition:opacity 1s}
.lvid.on{opacity:.55}
.lvid video{width:100%;height:100%;object-fit:cover;display:block}
.lscrim{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(6,7,15,.6),rgba(6,7,15,.15) 75%)}
.lring{position:absolute;left:50%;top:50%;width:88%;max-width:380px;aspect-ratio:380/470;transform:translate(-50%,-50%);pointer-events:none}
.lst{position:absolute;width:28px;height:28px;margin:-14px 0 0 -14px;opacity:0;filter:drop-shadow(0 0 7px rgba(255,214,90,.75))}
.lst::before{content:"";position:absolute;inset:0;background:linear-gradient(160deg,#ffe58a,#e0a82a);clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.run .lst{animation:lpop .55s cubic-bezier(.2,1.2,.4,1) calc(var(--i)*.18s) forwards,lpulse 2.6s ease-in-out calc(2.4s + var(--i)*.12s) infinite}
@keyframes lpop{0%{opacity:0;transform:scale(.2) rotate(-40deg)}55%{opacity:.55}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes lpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
.llogo{position:absolute;top:26px;left:0;right:0;text-align:center;font-weight:700;font-size:20px;letter-spacing:-.02em}
.llogo span{color:#61a2fe}
.lcenter{position:relative;text-align:center;padding:0 10px;max-width:300px}
.lhead{font-size:21px;line-height:28px;font-weight:700;letter-spacing:-.01em;margin:0}
.lgold{background:linear-gradient(135deg,#b8862a,#f0cf6e 45%,#b8862a);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.lsub{margin:10px 0 0;font-size:13px;line-height:19px;color:#e6e9f7}
.lbar{width:150px;height:3px;border-radius:2px;background:rgba(255,255,255,.18);margin:22px auto 8px;overflow:hidden}
.lbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#b8862a,#f0cf6e)}
.run .lbar i{animation:lfill 2.4s cubic-bezier(.3,.1,.3,1) forwards}
@keyframes lfill{to{width:100%}}
.lnote{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#c9cde8;margin:0}
@media (prefers-reduced-motion:reduce){.lst{opacity:1;animation:none!important}.lbar i{width:100%;animation:none!important}}
</style>
